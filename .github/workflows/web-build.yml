# web-build — the deployable web bundle for the fivex gateway.
#
# Authored 2026-09-01 as part of moving fivex's prod deploy onto CI-built
# artifacts (the local build+sync path cost 92 minutes; see fivex
# docs/conformance). Every webdav app ships the SAME workflow, differing only
# in APP_SLUG: build web at the gateway base-href, upload the bundle as an
# artifact the deploy can fetch instead of rebuilding locally.
#
# Standard build flags mirror fivex convention: --release, and
# --no-tree-shake-icons (required across fivex Flutter web builds).
name: web-build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  APP_SLUG: owntrack

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - run: flutter pub get

      - name: analyze
        run: flutter analyze

      - name: test
        run: flutter test

      - name: test browser storage and startup recovery
        timeout-minutes: 10
        run: flutter test --platform chrome test/browser/outbox_test.dart test/browser/bootstrap_recovery_test.dart

      - name: install local MQTT broker
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y mosquitto mosquitto-clients

      - name: test MQTT broker delivery
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          broker_config="$(mktemp)"
          broker_log="$(mktemp)"
          broker_pid=""
          cleanup() {
            result=$?
            trap - EXIT
            if [ -n "$broker_pid" ]; then
              kill "$broker_pid" 2>/dev/null || true
              wait "$broker_pid" 2>/dev/null || true
            fi
            if [ "$result" -ne 0 ]; then
              cat "$broker_log"
            fi
            rm -f "$broker_config" "$broker_log"
            exit "$result"
          }
          trap cleanup EXIT
          cat > "$broker_config" <<'CONFIG'
          listener 28884 127.0.0.1
          allow_anonymous true
          persistence false
          CONFIG
          mosquitto -c "$broker_config" > "$broker_log" 2>&1 &
          broker_pid=$!
          ready=0
          for attempt in {1..20}; do
            if ! kill -0 "$broker_pid" 2>/dev/null; then
              echo "Local MQTT broker exited before becoming ready" >&2
              exit 1
            fi
            if timeout 1 mosquitto_pub -h 127.0.0.1 -p 28884 -q 1 -t owntracks/ci/readiness -n 2>/dev/null; then
              ready=1
              break
            fi
            sleep 0.25
          done
          if [ "$ready" -ne 1 ] || ! kill -0 "$broker_pid" 2>/dev/null; then
            echo "Local MQTT broker did not acknowledge the readiness message" >&2
            exit 1
          fi
          flutter test --dart-define=MQTT_TEST_PORT=28884 test/integration/mqtt_broker_test.dart

      - name: test native MQTT TLS
        timeout-minutes: 10
        run: bash tool/verify_mqtt_tls.sh

      - name: test authenticated browser WSS
        timeout-minutes: 10
        run: bash tool/verify_mqtt_wss.sh

      - name: build web bundle
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          if [ -z "$MAPS_API_KEY" ]; then
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              flutter build web --release --no-tree-shake-icons --base-href "/${APP_SLUG}/"
              exit 0
            fi
            echo "MAPS_API_KEY must be configured for a deployable map build" >&2
            exit 1
          fi
          flutter build web --release --no-tree-shake-icons --base-href "/${APP_SLUG}/" --dart-define="MAPS_API_KEY=$MAPS_API_KEY"

      - name: stamp build provenance
        run: |
          printf '{"app":"%s","sha":"%s","ref":"%s","built":"%s"}\n' \
            "${{ env.APP_SLUG }}" "${{ github.sha }}" "${{ github.ref_name }}" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > build/web/build-info.json

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: web-${{ env.APP_SLUG }}
          path: build/web
          retention-days: 30
