name: owntrack
description: "OwnTracks - Location tracking application unified for Android and iOS"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # Database
  drift: ^2.20.3
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.5
  path: ^1.9.0

  # Networking
  mqtt_client: ^10.5.0
  dio: ^5.7.0
  connectivity_plus: ^6.1.1

  # Location Services
  geolocator: ^13.0.2
  permission_handler: ^11.3.1
  flutter_background_service: ^5.0.14
  # workmanager: ^0.5.2  # TODO: Add back in Phase 3 (has compatibility issues)

  # Maps - using flutter_map as requested
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Security & Encryption
  cryptography: ^2.7.0
  flutter_secure_storage: ^9.2.2

  # UI/UX
  cached_network_image: ^3.4.1
  flutter_local_notifications: ^18.0.1
  url_launcher: ^6.3.1
  share_plus: ^10.1.2
  # qr_code_scanner: ^1.0.1  # TODO: Add back when needed (has namespace issues with AGP 8+)

  # Utilities
  logger: ^2.5.0
  shared_preferences: ^2.3.3
  intl: ^0.20.1
  equatable: ^2.0.7

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Linting
  flutter_lints: ^5.0.0
  custom_lint: ^0.7.0
  riverpod_lint: ^2.6.2

  # Code Generation
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.2
  drift_dev: ^2.20.3

  # Testing
  mocktail: ^1.0.4
  integration_test:
    sdk: flutter

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
